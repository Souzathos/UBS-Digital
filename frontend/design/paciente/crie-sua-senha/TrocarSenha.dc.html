<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Crie sua senha</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;family=Atkinson+Hyperlegible+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}button,input{font:inherit;color:inherit}
a{color:#0A5FB4;text-decoration:none}a:hover{color:#083F82}
</style>
</helmet>
<div style="width: 390px; height: 844px; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; background: #F1F5FA; color: #082C63; font-family: 'Public Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.35">
<header style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<img src="./assets/eb5bdd90ce37549e80ce27aaf805f342.png" alt="UBS Vale do Sinos" width="49" height="36" style="flex: none; display: block; width: 49px; height: 36px">
<a href="Acessibilidade.dc.html" style="flex: none; min-height: 48px; padding: 0 12px; border: 1px solid #C3CFDF; border-radius: 10px; background: #FFFFFF; color: #082C63; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5a1.6 1.6 0 110 3.2 1.6 1.6 0 010-3.2zM5 8.5l7 1.5 7-1.5M12 10v4.5M12 14.5L9 21M12 14.5l3 6.5"></path></svg>
Acessibilidade
</a>
</header>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 8px">
<h1 style="margin: 0; font-size: 32px; line-height: 1.1; font-weight: 700">Crie sua senha</h1>
<p style="margin: 0; font-size: 17px; color: #41536F">Troque a senha que a recepção entregou por uma senha só sua.</p>
</div>
<sc-for list="{{campos}}" as="c" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="{{c.id}}" style="font-size: 17px; font-weight: 600">{{c.rotulo}}</label>
<div style="position: relative; display: flex">
<input id="{{c.id}}" type="{{c.tipo}}" autocomplete="{{c.auto}}" defaultValue="{{c.valor}}" aria-invalid="{{c.invalido}}" style="flex: 1; min-width: 0; height: 60px; padding: 0 64px 0 16px; border: 1.5px solid {{c.borda}}; border-radius: 10px; background: #FFFFFF; font-family: 'Atkinson Hyperlegible Mono', ui-monospace, monospace; font-size: 22px; font-weight: 600">
<button onClick="{{c.alternar}}" aria-label="{{c.rotuloOlho}}" aria-pressed="{{c.vendo}}" aria-controls="{{c.id}}" style="position: absolute; right: 6px; top: 6px; width: 48px; height: 48px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: #082C63; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{c.olho}}"></path></svg>
</button>
</div>
<sc-if value="{{c.temDica}}" hint-placeholder-val="{{false}}">
<span style="font-size: 15px; font-weight: {{c.dicaPeso}}; color: {{c.dicaCor}}">{{c.dica}}</span>
</sc-if>
</div>
</sc-for>
<a href="MeusAtendimentos.dc.html" style="margin-top: 6px; min-height: 60px; border-radius: 10px; background: #082C63; color: #FFFFFF; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center">Salvar e entrar</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"erro":{"editor":"enum","options":["nenhum","diferentes"],"default":"nenhum"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const dif = (this.props.erro || 'nenhum') === 'diferentes';
const ABERTO = 'M3 3l18 18M10.6 5.1A10 10 0 0112 5c6.5 0 10 7 10 7a17 17 0 01-3.2 4.1M6.6 6.6A17 17 0 002 12s3.5 7 10 7a9.6 9.6 0 005.4-1.6M9.9 9.9a3 3 0 004.2 4.2';
const FECHADO = 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 15a3 3 0 100-6 3 3 0 000 6z';
const CAMPOS = [
{ id: 'atual', rotulo: 'Senha atual', auto: 'current-password', valor: '482913', dica: 'É a senha que a recepção entregou.' },
{ id: 'nova', rotulo: 'Nova senha', auto: 'new-password', valor: 'flores74', dica: 'Use pelo menos 6 letras ou números.' },
{ id: 'repetir', rotulo: 'Repita a nova senha', auto: 'new-password', valor: dif ? 'flores47' : 'flores74', dica: dif ? 'As senhas não são iguais. Digite de novo.' : '' }
];
return {
campos: CAMPOS.map((c) => {
const vendo = !!s[c.id];
const erroAqui = dif && c.id === 'repetir';
return Object.assign({}, c, {
tipo: vendo ? 'text' : 'password',
vendo,
olho: vendo ? ABERTO : FECHADO,
rotuloOlho: (vendo ? 'Esconder ' : 'Mostrar ') + c.rotulo.toLowerCase(),
invalido: erroAqui ? 'true' : 'false',
borda: erroAqui ? '#B31400' : '#082C63',
temDica: !!c.dica,
dicaCor: erroAqui ? '#8A1000' : '#41536F',
dicaPeso: erroAqui ? 700 : 400,
alternar: () => this.setState({ [c.id]: !vendo })
});
})
};
}
}
</script>
</body>
</html>
