<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entrar no app</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;family=Atkinson+Hyperlegible+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}button,input{font:inherit;color:inherit}
a{color:#0A5FB4;text-decoration:none}a:hover{color:#083F82}
input::placeholder{color:#6B7A92}
</style>
</helmet>
<div style="width: 390px; height: 844px; padding: 56px 24px 32px; display: flex; flex-direction: column; align-items: stretch; overflow: hidden; background: #F1F5FA; color: #082C63; font-family: 'Public Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.35">
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<img src="./assets/eb5bdd90ce37549e80ce27aaf805f342.png" alt="" width="150" height="110" style="display: block; width: 150px; height: 110px">
<h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700; text-align: center">UBS Vale do Sinos</h1>
</div>
<div style="height: 36px"></div>
<div style="display: flex; flex-direction: column; gap: 14px">
<sc-if value="{{erro}}" hint-placeholder-val="{{false}}">
<div role="alert" style="padding: 12px 14px; border: 2px solid #B31400; border-radius: 10px; background: #FFFFFF; display: flex; align-items: flex-start; gap: 10px; color: #8A1000">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M12 7v6M12 16.5v.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
<span style="display: flex; flex-direction: column">
<span style="font-size: 18px; font-weight: 600">CPF ou senha inválidos</span>
<span style="font-size: 15px; color: #082C63">Confira os números e tente de novo.</span>
</span>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="cpf" style="font-size: 17px; font-weight: 600">CPF</label>
<input id="cpf" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" defaultValue="123.456.789-09" style="height: 60px; padding: 0 16px; border: 1.5px solid {{bordaCampo}}; border-radius: 10px; background: #FFFFFF; font-family: 'Atkinson Hyperlegible Mono', ui-monospace, monospace; font-size: 22px; font-weight: 600; letter-spacing: 0.5px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="senha" style="font-size: 17px; font-weight: 600">Senha</label>
<div style="position: relative; display: flex">
<input id="senha" type="{{tipoSenha}}" autocomplete="current-password" defaultValue="482913" style="flex: 1; min-width: 0; height: 60px; padding: 0 64px 0 16px; border: 1.5px solid {{bordaCampo}}; border-radius: 10px; background: #FFFFFF; font-family: 'Atkinson Hyperlegible Mono', ui-monospace, monospace; font-size: 22px; font-weight: 600">
<button onClick="{{alternarSenha}}" aria-label="{{rotuloSenha}}" aria-pressed="{{mostrando}}" aria-controls="senha" style="position: absolute; right: 6px; top: 6px; width: 48px; height: 48px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: #082C63; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{olho}}"></path></svg>
</button>
</div>
</div>
<a href="TrocarSenha.dc.html" style="margin-top: 6px; min-height: 60px; border-radius: 10px; background: #082C63; color: #FFFFFF; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center">Entrar</a>
</div>
<div style="flex: 1.3"></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<sc-if value="{{ajuda}}" hint-placeholder-val="{{false}}">
<p role="status" style="margin: 0 0 6px; padding: 10px 14px; border-radius: 10px; background: #FFFFFF; border: 1px solid #DCE5F0; font-size: 15px; text-align: center">A recepção da UBS cria uma senha nova para você. Leve um documento com foto.</p>
</sc-if>
<button onClick="{{alternarAjuda}}" aria-expanded="{{ajuda}}" style="min-height: 48px; padding: 0 12px; border: 0; background: transparent; color: #0A5FB4; font-size: 15px; font-weight: 600; text-decoration: underline">Esqueci minha senha</button>
<a href="EquipeEntrar.dc.html" style="min-height: 48px; padding: 0 12px; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: underline">Sou da equipe da UBS</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"erro":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const erro = !!(this.props.erro ?? false);
const mostrando = !!s.mostrar;
return {
erro,
bordaCampo: erro ? '#B31400' : '#082C63',
tipoSenha: mostrando ? 'text' : 'password',
mostrando,
rotuloSenha: mostrando ? 'Esconder senha' : 'Mostrar senha',
olho: mostrando
? 'M3 3l18 18M10.6 5.1A10 10 0 0112 5c6.5 0 10 7 10 7a17 17 0 01-3.2 4.1M6.6 6.6A17 17 0 002 12s3.5 7 10 7a9.6 9.6 0 005.4-1.6M9.9 9.9a3 3 0 004.2 4.2'
: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 15a3 3 0 100-6 3 3 0 000 6z',
alternarSenha: () => this.setState({ mostrar: !mostrando }),
ajuda: !!s.ajuda,
alternarAjuda: () => this.setState({ ajuda: !s.ajuda })
};
}
}
</script>
</body>
</html>
