<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Equipe: agenda do dia e presença</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;family=Atkinson+Hyperlegible+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}button,input{font:inherit;color:inherit}
a{color:#7CC4F5;text-decoration:none}a:hover{color:#CDE6FB}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #061A3D; color: #F2F7FD; font-family: 'Public Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.35">
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 56px 20px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 28px; line-height: 1.1; font-weight: 600">Agenda de hoje</h1>
<p style="margin: 0; font-size: 14px; color: #B5C8E2">Qui, 10/12 · UBS Feitoria</p>
</div>
<a href="EquipeAgendar.dc.html" style="flex: none; min-height: 48px; padding: 0 14px; border-radius: 10px; background: #F2F7FD; color: #061A3D; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
Agendar
</a>
</div>
<div role="group" aria-label="Filtrar agenda" style="flex: none; display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{filtros}}" as="f" hint-placeholder-count="4">
<button onClick="{{f.escolher}}" aria-pressed="{{f.sel}}" style="min-height: 48px; padding: 0 12px; border-radius: 24px; border: 1.5px solid {{f.borda}}; background: {{f.fundo}}; color: {{f.tinta}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px">
{{f.nome}}
<span style="min-width: 22px; padding: 0 6px; border-radius: 11px; background: {{f.contaFundo}}; color: {{f.contaTinta}}; font-size: 13px; font-weight: 700; text-align: center">{{f.conta}}</span>
</button>
</sc-for>
</div>
<div style="flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="3">
<div style="padding: 8px 12px; border: 1px solid #1F4177; border-radius: 10px; background: #0C2A5A; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 22px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums">{{k.valor}}</span>
<span style="font-size: 13px; color: #B5C8E2">{{k.rotulo}}</span>
</div>
</sc-for>
</div>
<div style="flex: none; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{linhas}}" as="v" hint-placeholder-count="7">
<div style="border: 1px solid {{v.borda}}; border-radius: 10px; background: #0C2A5A; display: flex; flex-direction: column">
<button onClick="{{v.abrir}}" disabled="{{v.travada}}" aria-expanded="{{v.aberto}}" style="min-height: 64px; padding: 8px 12px; border: 0; background: transparent; display: flex; align-items: center; gap: 10px; text-align: left">
<span style="flex: none; width: 44px; font-family: 'Atkinson Hyperlegible Mono', ui-monospace, monospace; font-size: 15px; font-weight: 600">{{v.hora}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600">
{{v.nome}}
<sc-if value="{{v.selo}}" hint-placeholder-val="{{false}}">
<svg role="img" aria-label="Selo de vulnerável" width="16" height="16" viewBox="0 0 24 24" fill="#7CC4F5" style="flex: none"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path></svg>
</sc-if>
</span>
<span style="display: flex; align-items: center; flex-wrap: wrap; gap: 6px">
<span style="display: flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 5px; border: 1.5px solid {{v.etqBorda}}; background: {{v.etqFundo}}; color: {{v.etqTinta}}; font-size: 12px; font-weight: 600">
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{v.etqIcone}}"></path></svg>
{{v.etqNome}}
</span>
<span style="font-size: 14px; font-weight: 600; color: #CDE6FB">{{v.item}}</span>
</span>
<span style="font-size: 13px; color: #B5C8E2">{{v.nota}}</span>
</span>
<span style="flex: none; padding: 4px 8px; border-radius: 6px; border: 1.5px solid {{v.chipBorda}}; background: {{v.fundo}}; color: {{v.tinta}}; font-size: 13px; font-weight: 600">{{v.estado}}</span>
</button>
<sc-if value="{{v.aberto}}" hint-placeholder-val="{{false}}">
<div style="padding: 0 12px 12px; display: flex; flex-direction: column; gap: 6px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button onClick="{{v.veio}}" style="min-height: 48px; border-radius: 8px; border: 0; background: #F2F7FD; color: #061A3D; font-size: 15px; font-weight: 600">Compareceu</button>
<button onClick="{{v.faltou}}" style="min-height: 48px; border-radius: 8px; border: 1.5px solid #B5C8E2; background: transparent; font-size: 15px; font-weight: 600">Faltou</button>
</div>
<span style="font-size: 13px; color: #B5C8E2">{{v.dica}}</span>
</div>
</sc-if>
</div>
</sc-for>
<sc-if value="{{vazio}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 16px; border: 1.5px dashed #4D6FA3; border-radius: 10px; font-size: 15px; color: #B5C8E2">{{vazioTexto}}</p>
</sc-if>
</div>
<div style="flex: none; display: flex; align-items: flex-start; gap: 8px; padding: 0 2px; font-size: 13px; color: #B5C8E2">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="#7CC4F5" style="flex: none; margin-top: 2px"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path></svg>
<span>Selo de vulnerável: não perde pontos e não tem cancelamento automático. Só a equipe vê.</span>
</div>
</div>
<div style="flex: none; height: 84px"><dc-import name="NavEquipe" active="agenda" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const reg = s.reg || {};
const sel = s.sel === undefined ? 'osvaldo' : s.sel;
const filtro = s.filtro || 'todos';
const ETQ = {
medico: { etqNome: 'Médico', etqFundo: '#F2F7FD', etqTinta: '#061A3D', etqBorda: '#F2F7FD', etqIcone: 'M6 3v5a4 4 0 008 0V3M10 12v3a5 5 0 0010 0v-2M20 13a1.8 1.8 0 100-3.6 1.8 1.8 0 000 3.6z' },
enf: { etqNome: 'Enfermagem', etqFundo: 'transparent', etqTinta: '#CDE6FB', etqBorda: '#7CC4F5', etqIcone: 'M9 4h6v5h5v6h-5v5H9v-5H4V9h5z' }
};
const LINHAS = [
{ id: 'jorge', hora: '08:00', nome: 'Jorge A.', tipo: 'enf', item: 'Coleta de exames', nota: 'Confirmou no 1º aviso · Enf. Rosana', conf: true, selo: false, feito: 'veio' },
{ id: 'lia', hora: '08:20', nome: 'Lia M.', tipo: 'medico', item: 'Pré-natal', nota: 'Confirmou no 1º aviso', conf: true, selo: false, feito: 'faltou' },
{ id: 'osvaldo', hora: '09:00', nome: 'Osvaldo M.', tipo: 'medico', item: 'Consulta clínica geral', nota: 'A filha confirmou pelo link', conf: true, selo: true },
{ id: 'marina', hora: '09:30', nome: 'Marina S.', tipo: 'enf', item: 'Vacinação', nota: 'Confirmou no 1º aviso · Enf. Rosana', conf: true, selo: false },
{ id: 'rita', hora: '10:20', nome: 'Rita L.', tipo: 'medico', item: 'Retorno', nota: 'Adiantou de 21/12', conf: true, selo: false, encaixe: true },
{ id: 'carla', hora: '11:00', nome: 'Carla T.', tipo: 'enf', item: 'Curativo', nota: 'Adiantou de 18/12 · Enf. Rosana', conf: true, selo: false, encaixe: true },
{ id: 'sandra', hora: '11:40', nome: 'Sandra P.', tipo: 'medico', item: 'Hiperdia', nota: 'Alerta com o ACS', conf: false, selo: true }
];
const efeito = (l, r) => r === 'veio' ? 'Compareceu · +10 pontos'
: l.selo ? 'Faltou · sem perda (selo)'
: l.conf ? 'Faltou · −30 pontos'
: 'Faltou · sem perda';
const dica = (l) => l.selo ? 'Com selo, faltar não tira pontos.'
: l.conf ? 'Estava confirmado: faltar tira 30 pontos.'
: 'Não tinha confirmado: faltar não tira pontos.';
let veio = 0, faltou = 0;
const todas = LINHAS.map((l) => {
const r = reg[l.id] || l.feito || '';
if (r === 'veio') veio++;
if (r === 'faltou') faltou++;
const aberto = !r && sel === l.id;
const chip = r === 'veio' ? { estado: 'Compareceu', fundo: '#82CBF6', tinta: '#061A3D', chipBorda: '#82CBF6' }
: r === 'faltou' ? { estado: 'Faltou', fundo: 'transparent', tinta: '#F2F7FD', chipBorda: '#B5C8E2' }
: l.conf ? { estado: l.encaixe ? 'Encaixada' : 'Confirmada', fundo: '#123B73', tinta: '#CDE6FB', chipBorda: '#123B73' }
: { estado: 'Pendente', fundo: '#FEC301', tinta: '#061A3D', chipBorda: '#FEC301' };
return Object.assign({}, l, ETQ[l.tipo], chip, {
r,
nota: r ? efeito(l, r) : l.nota,
aberto,
travada: !!r,
borda: aberto ? '#7CC4F5' : '#1F4177',
dica: dica(l),
abrir: () => this.setState({ sel: sel === l.id ? '' : l.id }),
veio: () => this.setState({ reg: Object.assign({}, reg, { [l.id]: 'veio' }), sel: '' }),
faltou: () => this.setState({ reg: Object.assign({}, reg, { [l.id]: 'faltou' }), sel: '' })
});
});
const passa = (l) => filtro === 'todos' || (filtro === 'faltas' ? l.r === 'faltou' : l.tipo === filtro);
const linhas = todas.filter(passa);
const conta = (f) => todas.filter((l) => f === 'todos' || (f === 'faltas' ? l.r === 'faltou' : l.tipo === f)).length;
const FILTROS = [['todos', 'Todos'], ['medico', 'Médico'], ['enf', 'Enfermagem'], ['faltas', 'Faltas']];
return {
filtros: FILTROS.map((f) => {
const on = f[0] === filtro;
return { nome: f[1], conta: String(conta(f[0])), sel: on,
fundo: on ? '#F2F7FD' : 'transparent', tinta: on ? '#061A3D' : '#F2F7FD', borda: on ? '#F2F7FD' : '#4D6FA3',
contaFundo: on ? '#061A3D' : '#123B73', contaTinta: on ? '#F2F7FD' : '#CDE6FB',
escolher: () => this.setState({ filtro: f[0] }) };
}),
kpis: [
{ valor: String(veio), rotulo: veio === 1 ? 'compareceu' : 'compareceram' },
{ valor: String(faltou), rotulo: faltou === 1 ? 'faltou' : 'faltaram' },
{ valor: '2', rotulo: 'reaproveitadas' }
],
linhas,
vazio: linhas.length === 0,
vazioTexto: filtro === 'faltas' ? 'Nenhuma falta registrada hoje.' : 'Nenhum atendimento neste filtro.'
};
}
}
</script>
</body>
</html>
