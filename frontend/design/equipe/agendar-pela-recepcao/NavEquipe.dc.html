<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Navegação da equipe</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Atkinson+Hyperlegible+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Seções da equipe" style="width: 390px; height: 84px; box-sizing: border-box; padding: 8px 8px 24px; display: flex; background: #0C2A5A; border-top: 1px solid #1F4177; font-family: 'Public Sans', system-ui, sans-serif">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<a href="{{t.href}}" aria-current="{{t.atual}}" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; font-size: 12px; line-height: 16px; color: {{t.fg}}; font-weight: {{t.w}}">
<span style="position: relative; width: 52px; height: 30px; border-radius: 6px; background: {{t.bg}}; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.d}}"></path></svg>
<sc-if value="{{t.ponto}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; top: 3px; right: 12px; width: 9px; height: 9px; border-radius: 50%; background: #FEC301; border: 2px solid #0C2A5A"></span>
</sc-if>
</span>
{{t.label}}
</a>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["agenda","ofertas","alertas","pacientes"],"default":"agenda"},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'agenda';
const tabs = [
{ id: 'agenda', label: 'Agenda', href: 'EquipeAgenda.dc.html', d: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4' },
{ id: 'ofertas', label: 'Ofertas', href: 'EquipeVagas.dc.html', d: 'M4 9h13l-3-3M20 15H7l3 3' },
{ id: 'alertas', label: 'Alertas', href: 'EquipeAlertas.dc.html', d: 'M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4', ponto: true },
{ id: 'pacientes', label: 'Pacientes', href: 'EquipePacientes.dc.html', d: 'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0' }
];
return { tabs: tabs.map((t) => Object.assign({ ponto: false }, t, t.id === active
? { atual: 'page', fg: '#F2F7FD', w: 700, bg: '#14498F' }
: { atual: 'false', fg: '#B5C8E2', w: 500, bg: 'transparent' })) };
}
}
</script>
</body>
</html>
