<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Equipe: alertas de vulneráveis</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;family=Atkinson+Hyperlegible+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}button,input{font:inherit;color:inherit}
a{color:#7CC4F5;text-decoration:none}a:hover{color:#CDE6FB}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #061A3D; color: #F2F7FD; font-family: 'Public Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.35">
<div style="flex: 1; min-height: 0; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 28px; line-height: 1.1; font-weight: 600">Alertas</h1>
<p style="margin: 0; font-size: 14px; color: #B5C8E2">Pacientes com selo que não responderam aos avisos</p>
</div>
<div style="background: #123B73; border-radius: 10px; padding: 12px 16px; display: flex; align-items: flex-start; gap: 10px">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#7CC4F5" style="flex: none; margin-top: 1px"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path></svg>
<p style="margin: 0; font-size: 14px">Com selo de vulnerável, a consulta não é cancelada sem resposta. Ela continua pendente e a equipe faz o contato.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{alertas}}" as="a" hint-placeholder-count="3">
<div style="background: #0C2A5A; border: 1px solid #1F4177; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600">
{{a.nome}}
<svg role="img" aria-label="Selo de vulnerável" width="16" height="16" viewBox="0 0 24 24" fill="#7CC4F5" style="flex: none"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path></svg>
</span>
<span style="flex: none; padding: 4px 10px; border-radius: 6px; background: {{a.fundo}}; color: {{a.tinta}}; font-size: 13px; font-weight: 600">{{a.estado}}</span>
</div>
<span style="font-size: 14px">Consulta {{a.consulta}}</span>
<span style="font-size: 13px; color: #B5C8E2">{{a.motivo}}</span>
<div style="margin-top: 4px; display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="font-size: 13px; font-weight: 600; color: #CDE6FB">{{a.situacao}}</span>
<sc-if value="{{a.podeAtribuir}}" hint-placeholder-val="{{true}}">
<button onClick="{{a.atribuir}}" style="flex: none; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 0; background: #F2F7FD; color: #061A3D; font-size: 14px; font-weight: 600">Atribuir ao ACS</button>
</sc-if>
<sc-if value="{{a.podeBaixar}}" hint-placeholder-val="{{false}}">
<button onClick="{{a.baixar}}" style="flex: none; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1.5px solid #B5C8E2; background: transparent; font-size: 14px; font-weight: 600">Dar baixa</button>
</sc-if>
</div>
</div>
</sc-for>
</div>
</div>
<div style="flex: none; height: 84px"><dc-import name="NavEquipe" active="alertas" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const st = s.st || {};
const ALERTAS = [
{ id: 'jose', nome: 'José A., 81', consulta: 'amanhã, 11/12 · 10:20', motivo: 'Não respondeu aos 3 avisos. Não tem contato vinculado.', status: 'ABERTO', aberto: 'Aberto desde ontem, 10h20' },
{ id: 'sandra', nome: 'Sandra P., 72', consulta: 'hoje · 11:40', motivo: 'Não respondeu aos 3 avisos. A filha também não.', status: 'EM_CONTATO', contato: 'Com o ACS Márcio desde 8/12' },
{ id: 'maria', nome: 'Maria L., 77', consulta: 'amanhã, 11/12 · 14:10', motivo: 'Não respondeu aos 3 avisos.', status: 'RESOLVIDO', resolvido: 'Confirmou por telefone em 9/12' }
];
const VISUAL = {
ABERTO: { estado: 'Aberto', fundo: '#FEC301', tinta: '#061A3D' },
EM_CONTATO: { estado: 'Em contato', fundo: '#123B73', tinta: '#CDE6FB' },
RESOLVIDO: { estado: 'Resolvido', fundo: '#82CBF6', tinta: '#061A3D' }
};
return { alertas: ALERTAS.map((a) => {
const status = st[a.id] || a.status;
const mudou = !!st[a.id];
const situacao = status === 'ABERTO' ? a.aberto
: status === 'EM_CONTATO' ? (mudou ? 'Com o ACS Márcio desde agora' : a.contato)
: (mudou ? 'Contato feito pela equipe hoje' : a.resolvido);
return Object.assign({}, a, VISUAL[status], {
situacao,
podeAtribuir: status === 'ABERTO',
podeBaixar: status === 'EM_CONTATO',
atribuir: () => this.setState({ st: Object.assign({}, st, { [a.id]: 'EM_CONTATO' }) }),
baixar: () => this.setState({ st: Object.assign({}, st, { [a.id]: 'RESOLVIDO' }) })
});
}) };
}
}
</script>
</body>
</html>
